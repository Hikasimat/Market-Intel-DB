name: Deploy MarketIntel Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketintel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    environment:
      name: marketintel-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          docker build \
            -f deploy/aws/backend.Dockerfile \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EC2
        id: deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PARAMETER_NAME: ${{ vars.SSM_PARAMETER_NAME }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_attempt }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MarketIntel backend $GITHUB_SHA" \
            --parameters commands="[
              \"set -e\",
              \"mkdir -p /opt/marketintel/staticfiles\",
              \"chmod 755 /opt/marketintel\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"aws ssm get-parameter --name $PARAMETER_NAME --with-decryption --query 'Parameter.Value' --output text > /opt/marketintel/.env\",
              \"chmod 600 /opt/marketintel/.env\",
              \"chown 10001:10001 /opt/marketintel/staticfiles\",
              \"docker pull $IMAGE_URI\",
              \"docker run --rm --env-file /opt/marketintel/.env -v /opt/marketintel/staticfiles:/app/staticfiles $IMAGE_URI python manage.py check --deploy\",
              \"docker run --rm --env-file /opt/marketintel/.env -v /opt/marketintel/staticfiles:/app/staticfiles $IMAGE_URI python manage.py migrate --noinput\",
              \"docker run --rm --env-file /opt/marketintel/.env -v /opt/marketintel/staticfiles:/app/staticfiles $IMAGE_URI python manage.py collectstatic --noinput\",
              \"docker rm -f marketintel-api 2>/dev/null || true\",
              \"docker run -d --name marketintel-api --restart unless-stopped --env-file /opt/marketintel/.env -p 127.0.0.1:8000:8000 -v /opt/marketintel/staticfiles:/app/staticfiles --init --stop-timeout 30 --security-opt no-new-privileges:true --log-opt max-size=10m --log-opt max-file=3 $IMAGE_URI\",
              \"sleep 5\",
              \"docker inspect --format='{{.State.Status}}' marketintel-api\",
              \"docker exec marketintel-api python manage.py check\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undelivered|Terminated)
                echo "Deployment failed with status: $STATUS"

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}" \
                  --output json

                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out waiting for SSM."
          exit 1