# =============================================================================
# deploy/aws/nginx.conf
#
# Nginx configuration for MarketIntel Django backend on AWS EC2.
# Replace YOUR_BACKEND_DOMAIN with your actual domain before use.
#
# Install:
#   sudo cp deploy/aws/nginx.conf /etc/nginx/sites-available/marketintel
#   sudo ln -s /etc/nginx/sites-available/marketintel /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_BACKEND_DOMAIN;

    # Required for Let's Encrypt / certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_BACKEND_DOMAIN;

    # ── TLS certificates (provided by certbot) ─────────────────────────────
    # Run: sudo certbot --nginx -d YOUR_BACKEND_DOMAIN
    # Certbot will automatically fill in the paths below.
    ssl_certificate     /etc/letsencrypt/live/YOUR_BACKEND_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_BACKEND_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header Referrer-Policy           same-origin;

    # ── Client body (email attachments up to 30 MB) ────────────────────────
    client_max_body_size 30M;

    # ── Static files ───────────────────────────────────────────────────────
    location /static/ {
        alias /opt/marketintel/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── API Health Check ───────────────────────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:8000/api/whatsapp/health/;
        proxy_set_header Host $host;
    }

    # ── Block root access (Frontend is on Amplify) ─────────────────────────
    location / {
        return 404 "API only. Frontend is hosted on AWS Amplify.";
    }

    # ── Proxy all Django/API traffic → Gunicorn ────────────────────────────
    location ~ ^/(api|admin) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Essential headers so Django knows the real request details
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts generous enough for SMTP/IMAP-backed API calls
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Pass request body through correctly
        proxy_request_buffering off;
    }
}
